<div class="container-options">
  <mat-card>
      <mat-card-content>
          <mat-card-title class="text-center"> {{title}} </mat-card-title>

          <div class="">

              <table mat-table [dataSource]="dataSource">

                  <ng-container matColumnDef="download">
                      <th mat-header-cell *matHeaderCellDef>Descargar</th>
                      <td mat-cell *matCellDef="let element">
                          <button mat-icon-button (click)="downloadFile(element)">
                              <mat-icon>file_download</mat-icon>
                          </button>
                      </td>
                  </ng-container>

                  <ng-container matColumnDef="remove">
                      <th mat-header-cell *matHeaderCellDef>Eliminar</th>
                      <td mat-cell *matCellDef="let element">
                          <button mat-icon-button (click)="checkUser({serviceRequestId: element.serviceRequestId, documentId:element.documentId, documentType: element.documentType, url: element.url, fileName: element.fn, statusId: element.statusId })">
                              <mat-icon>remove</mat-icon>
                          </button>
                      </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
          </div>

      </mat-card-content>
  </mat-card>
</div>
