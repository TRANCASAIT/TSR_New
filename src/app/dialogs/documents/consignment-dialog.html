<div class="custom-dialog-content">
  <h1 class="text-center" mat-dialog-title>
      Núm. Carta Porte
  </h1>
  <div mat-dialog-content>
      <form [formGroup]="consignmentNoteForm">
          <div class="text-center">
              <input matInput formControlName="documentId" [errorStateMatcher]="matcher" hidden>
              <div class="row">
                  <div class="col-sm-12">
                      <mat-form-field appearance="fill" class="mt-field">
                          <mat-label>Núm. Carta Porte</mat-label>
                          <input matInput placeholder="Núm. Carta Porte" formControlName="consignmentNote"
                              [errorStateMatcher]="matcher">
                          <mat-error> {{errorMsgFrm}}</mat-error>
                      </mat-form-field>
                  </div>

              </div>
              <div class="row">
                  <div class="col-sm-12">
                      <div *ngIf="spinnerOk" id="logSpinner" class="text-center d-flex justify-content-end">
                          <mat-progress-spinner class="text-right" color="warn" [mode]="mode" [value]="value"
                              [diameter]="40">
                          </mat-progress-spinner>
                      </div>
                  </div>
              </div>
              <div class="row">

                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                      <button [disabled]="consignmentNoteForm.invalid" color="primary" mat-flat-button
                          (click)="updateConsignmentNote(consignmentNoteForm.value)">{{btnTxt}}
                        <mat-icon>edit</mat-icon>
                        </button>
                  </div>
                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                    <button mat-flat-button mat-dialog-close color="warn">Cancelar
                      <mat-icon>cancel</mat-icon>
                    </button>
                </div>
              </div>
          </div>
      </form>
  </div>
</div>
