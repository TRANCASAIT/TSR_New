<div class="container">
  <mat-card class="card">
      <mat-card-content>
          <mat-card-title class="text-center">Operaciones</mat-card-title>
          <div class="container" [@bottomToTopAnimation]>
              <div class="row">
                <div class="col-12">
                  <mat-form-field class="mt-field-search" appearance="outline">
                      <mat-label>Buscar <mat-icon>search</mat-icon></mat-label>
                      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #inputSearch>
                  </mat-form-field>
              </div>

              <div class="col-12">
                <button mat-raised-button class="btn-right"
                    (click)="openDialog(({type:'new'}))"><mat-icon>add</mat-icon>
                    Agregar
                </button>
            </div>
              </div>
          </div>

          @if(spinner){
            <div class="spinner-container">
              <mat-spinner diameter="30" color="warn" class="spinner" ></mat-spinner>
            </div>
          }

          <div class="table-responsive" [hidden]="showTable">
              <table mat-table [dataSource]="dataSource">

                  <ng-container matColumnDef="operation">
                      <th mat-header-cell *matHeaderCellDef> Operación </th>
                      <td mat-cell *matCellDef="let element"> {{element.operationTypeName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="option">
                      <th mat-header-cell *matHeaderCellDef> Opción </th>
                      <td mat-cell *matCellDef="let element">
                          <mat-icon class="inactivo"
                              (click)="openDialog({type: 'edit', operation:element})">edit</mat-icon>
                      </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [hidden]="showTable" [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
          </div>
      </mat-card-content>
  </mat-card>
</div>
