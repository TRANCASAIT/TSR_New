<!-- <div class="container"> -->
  <mat-card class="card">
    <mat-card-content>
      <mat-card-title class="text-center">Compañías</mat-card-title>
      <div class="container">
        <div class="row">

          <div class="col-12">
            <mat-form-field class="mt-field-search" appearance="outline">
              <mat-label>Buscar <mat-icon>search</mat-icon></mat-label>
              <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #inputSearch>
            </mat-form-field>
          </div>

          <div class="col-12">
            <button mat-raised-button class="btn-right" (click)="openDialog(({type:'new'}))"><mat-icon>add</mat-icon>
              Agregar
            </button>
          </div>
        </div>
      </div>

      @if(spinnerOk){
        <div class="spinner-container">
          <mat-spinner diameter="30" color="warn" class="spinner" ></mat-spinner>
        </div>
      }

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" [hidden]="showTable">

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Estatus </th>
            <td mat-cell *matCellDef="let element">
              <div *ngIf="element.status == true"
                (click)="changeState({customerId:element.customerId, status: element.status, company: element.name})">
                <mat-icon class="activo" matTooltip="Cambiar Estatus">circle</mat-icon>
              </div>
              <div *ngIf="element.status == false"
                (click)="changeState({customerId:element.customerId,status: element.status})">
                <mat-icon class="inactivo">circle</mat-icon>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="state">
            <th mat-header-cell *matHeaderCellDef> Estado </th>
            <td mat-cell *matCellDef="let element"> {{element.stateName}} </td>
          </ng-container>

          <ng-container matColumnDef="city">
            <th mat-header-cell *matHeaderCellDef>Ciudad </th>
            <td mat-cell *matCellDef="let element"> {{element.cityName}} </td>
          </ng-container>

          <ng-container matColumnDef="customer">
            <th mat-header-cell *matHeaderCellDef> Cliente </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <ng-container matColumnDef="rfc">
            <th mat-header-cell *matHeaderCellDef>RFC </th>
            <td mat-cell *matCellDef="let element"> {{element.rfc}} </td>
          </ng-container>

          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef> Direccion </th>
            <td mat-cell *matCellDef="let element"> {{element.address}} </td>
          </ng-container>

          <ng-container matColumnDef="option">
            <th mat-header-cell *matHeaderCellDef> Opción </th>
            <td mat-cell *matCellDef="let element">
              <mat-icon class="inactivo" (click)="openDialog({type: 'edit', customer:element})">edit</mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [hidden]="showTable" [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
<!-- </div> -->
