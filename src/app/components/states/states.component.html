<div class="container">
  <mat-card class="card">
      <mat-card-content>
          <mat-card-title class="text-center">Estados</mat-card-title>
          <div class="container">
              <div class="row">

                  <div class="col-12">
                      <mat-form-field appearance="outline" class="mt-field">
                          <mat-label>Buscar <mat-icon>search</mat-icon></mat-label>
                          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #inputSearch>
                      </mat-form-field>
                  </div>
                  <div class="col-12">
                    <button mat-raised-button class="btn-right"
                        (click)="openDialog(({type:'new'}))"><mat-icon>add</mat-icon>
                        Agregar
                    </button>
                </div>
              </div>
          </div>
          @if(spinnerOk){
            <div class="spinner-container">
              <mat-spinner diameter="30" color="warn" class="spinner" ></mat-spinner>
            </div>
          }
          <div class="table-responsive" [hidden]="showTable">
              <table mat-table [dataSource]="dataSource">

                  <ng-container matColumnDef="state">
                      <th mat-header-cell *matHeaderCellDef> Estado </th>
                      <td mat-cell *matCellDef="let element"> {{element.stateName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="city">
                      <th mat-header-cell *matHeaderCellDef>  Ciudad </th>
                      <td mat-cell *matCellDef="let element"> {{element.cityName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="option">
                      <th mat-header-cell *matHeaderCellDef> Opción </th>
                      <td mat-cell *matCellDef="let element">
                          <mat-icon class="inactivo"
                              (click)="openDialog({type: 'edit', state:element})">edit</mat-icon>
                      </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [hidden]="showTable" [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
          </div>
      </mat-card-content>
  </mat-card>
</div>
