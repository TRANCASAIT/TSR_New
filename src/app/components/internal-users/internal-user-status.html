<div class="custom-dialog-content">
  <div mat-dialog-content>
      <p style="color: black;">¿Desea {{action}} usuario: <b>{{username}}?</b></p>
  </div>
  <div mat-dialog-actions align="center">
      <button mat-flat-button (click)="onYesClick()" cdkFocusInitial class="actionBtn" color="primary">Sí
        <mat-icon>check</mat-icon>
      </button>
      <button mat-flat-button color="warn" class="closeBtn" (click)="onNoClick()">No
        <mat-icon>cancel</mat-icon>
      </button>
  </div>
</div>
