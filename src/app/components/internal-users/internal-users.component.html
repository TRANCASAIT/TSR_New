<div class="container">
  <mat-card class="card">
      <mat-card-content>
          <mat-card-title class="text-center">Administrativos</mat-card-title>
          <div class="container" [@bottomToTopAnimation]>
              <div class="row">

                  <div class="col-12">
                      <mat-form-field appearance="outline" class="mt-field">
                          <mat-label>Buscar <mat-icon>search</mat-icon></mat-label>
                          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #inputSearch>
                      </mat-form-field>
                  </div>

                  <div class="col-12">
                    <button mat-raised-button color="warn" class="btn-right" *ngIf="appEdit"
                        (click)="openDialog(({type:'new'}))"><mat-icon>add</mat-icon>
                        Agregar
                    </button>
                  </div>
              </div>
          </div>
          @if(spinnerOk){
            <div class="spinner-container">
              <mat-spinner diameter="30" color="warn" class="spinner" ></mat-spinner>
            </div>
          }
          <div class="table-responsive" [hidden]="showTable">
              <table mat-table [dataSource]="dataSource">

                  <ng-container matColumnDef="status">
                      <th mat-header-cell *matHeaderCellDef>Estatus </th>
                      <td mat-cell *matCellDef="let element">
                          <div *ngIf="element.status == true" (click)="changeState({userId:element.userId, status: element.status, username: element.username, action: 'remove'})">
                            <mat-icon class="activo">circle</mat-icon>
                          </div>
                          <div *ngIf="element.status == false" (click)="changeState({userId:element.userId,status: element.status, username: element.username, action: 'restore'})">
                            <mat-icon class="inactivo">circle</mat-icon>
                          </div>
                        </td>
                  </ng-container>

                  <ng-container matColumnDef="username">
                      <th mat-header-cell *matHeaderCellDef> Username </th>
                      <td mat-cell *matCellDef="let element"> {{element.username}} </td>
                  </ng-container>

                  <ng-container matColumnDef="name">
                      <th mat-header-cell *matHeaderCellDef>Nombre </th>
                      <td mat-cell *matCellDef="let element"> {{element.givenName}} {{element.surname}} </td>
                  </ng-container>

                  <ng-container matColumnDef="customer">
                      <th mat-header-cell *matHeaderCellDef> Cliente </th>
                      <td mat-cell *matCellDef="let element"> {{element.customerName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="userType">
                      <th mat-header-cell *matHeaderCellDef>Tipo </th>
                      <td mat-cell *matCellDef="let element"> {{element.userTypeName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="option">
                      <th mat-header-cell *matHeaderCellDef> Opción </th>
                      <td mat-cell *matCellDef="let element" >
                          <mat-icon class="inactivo" *ngIf="appEdit"
                              (click)="openDialog({type: 'edit', user:element})">edit</mat-icon>
                      </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [hidden]="showTable" [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
          </div>
      </mat-card-content>
  </mat-card>
</div>
