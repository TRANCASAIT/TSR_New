<div class="custom-content-dialog">
  <h1 class="text-center" mat-dialog-title>
    Referencia
  </h1>
  <div mat-dialog-content>
    <form [formGroup]="referenceForm">
      <div class="text-center">
        <input matInput formControlName="serviceRequestId" [errorStateMatcher]="matcher" hidden>
        <div class="row">
          <div class="col-sm-12">
            <mat-form-field appearance="fill" class="mt-field">
              <mat-label>Referencia</mat-label>
              <input matInput placeholder="Referencia" formControlName="reference" [errorStateMatcher]="matcher">
              <mat-error> {{errorMsgFrm}}</mat-error>
            </mat-form-field>
          </div>

        </div>
        <div class="row">
          <div class="col-sm-12">
            <div *ngIf="spinner" id="logSpinner" class="text-center d-flex justify-content-end">
              <mat-progress-spinner class="text-right" color="warn" [mode]="mode" [value]="value" [diameter]="40">
              </mat-progress-spinner>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-6 top" [style]="'margin-top:.2em'">
            <button [disabled]="referenceForm.invalid" color="primary" mat-flat-button
              (click)="updateReference(referenceForm.value)">{{btnTxt}}
              <mat-icon>edit</mat-icon>
            </button>
          </div>
          <div class="col-sm-6 top" [style]="'margin-top:.2em'">
            <button mat-flat-button mat-dialog-close color="warn">Cancelar
              <mat-icon>cancel</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
