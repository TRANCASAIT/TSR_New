<div class="container">
  <h1 class="text-center" mat-dialog-title>
      Numero de caja
  </h1>
  <div mat-dialog-content>
      <form [formGroup]="boxForm">
          <div class="text-center">
              <input matInput formControlName="serviceRequestId" [errorStateMatcher]="matcher" hidden>
              <div class="row">
                  <div class="col-sm-12">
                      <mat-form-field appearance="fill" class="mt-field">
                          <mat-label>Numero de caja</mat-label>
                          <input matInput placeholder="Caja" formControlName="boxNumber"
                              [errorStateMatcher]="matcher">
                              <mat-icon matSuffix>inventory</mat-icon>
                          <mat-error> {{errorMsgFrm}}</mat-error>
                      </mat-form-field>
                  </div>

              </div>
              <div class="row">
                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                      <button [disabled]="boxForm.invalid" color="warn" mat-raised-button
                          (click)="updateBoxNumber(boxForm.value)">{{btnTxt}}</button>
                  </div>
                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                    <button mat-raised-button mat-dialog-close color="primary">Cancelar</button>
                </div>
              </div>
          </div>
      </form>
  </div>
</div>
