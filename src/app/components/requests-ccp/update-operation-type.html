<div class="container">
  <h1 class="text-center" mat-dialog-title>
      Tipo de operación
  </h1>
  <div mat-dialog-content>
      <form [formGroup]="operationForm">
          <div class="text-center">
              <input matInput formControlName="serviceRequestId" [errorStateMatcher]="matcher" hidden>
              <div class="row">
                  <div class="col-sm-6">
                      <mat-form-field appearance="fill" class="mt-field">
                          <mat-label>Operación</mat-label>
                          <mat-select placeholder="Seleccione una operación" formControlName="operationTypeId">
                              <mat-option *ngFor="let item of operationsList" [value]="item['operationTypeId']">{{
                                  item['operationTypeName']
                                  }}</mat-option>
                          </mat-select>
                          <mat-icon matSuffix>local_shipping</mat-icon>
                      </mat-form-field>
                  </div>

              </div>
              <div class="row">
                  <div class="col-sm-12">
                      <div *ngIf="spinnerOk" id="logSpinner" class="text-center d-flex justify-content-end">
                          <mat-progress-spinner class="text-right" color="warn" [mode]="mode" [value]="value"
                              [diameter]="40">
                          </mat-progress-spinner>
                      </div>
                  </div>
              </div>
              <div class="row">
                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                      <button [disabled]="operationForm.invalid" color="warn" mat-raised-button
                          (click)="updateOperation(operationForm.value)">{{btnTxt}}</button>
                  </div>
                  <div class="col-sm-6 top" [style]="'margin-top:.2em'">
                    <button mat-raised-button mat-dialog-close color="primary">Cancelar</button>
                </div>
              </div>
          </div>
      </form>
  </div>
</div>
